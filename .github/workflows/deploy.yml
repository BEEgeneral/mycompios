name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondtech/vercel-action@v2
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      
      - name: Health check after deploy
        run: |
          sleep 10
          curl -sf https://www.mycompi.com/api/health-check || exit 1
      
      - name: Notify success
        if: success()
        run: echo "Deploy successful - https://www.mycompi.com"
      
      - name: Notify failure
        if: failure()
        run: echo "Deploy failed - check Vercel dashboard"