name: Deploy to InsForge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List files
        run: ls -la
      
      - name: Deploy to InsForge
        env:
          INSFORGE: ${{ secrets.INSFORGE }}
        run: |
          echo "Deploying with INSFORGE secret..."
          if [ -z "$INSFORGE" ]; then
            echo "INSFORGE secret not set"
            exit 1
          fi
          npx --yes @insforge/cli deployments deploy . 2>&1 || echo "Deploy command finished"
      
      - name: Show next steps
        if: success()
        run: |
          echo "Deployment triggered. Check GitHub Actions for status."
          echo "Frontend should be at: https://guuimyx3.insforge.site"
