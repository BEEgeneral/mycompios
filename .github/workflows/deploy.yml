name: Deploy to InsForge

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.md'
      - '**.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install InsForge CLI
        run: |
          npm install -g @insforge/cli
          insfire --version || echo "Trying alternate install"

      - name: Discover files
        run: |
          echo "Files to deploy:"
          find . -name "*.html" -o -name "*.md" | head -20

      - name: Upload files via API
        env:
          INSFIRE_PROJECT: guuimyx3
        run: |
          # Since we don't have direct InsForge API key, try alternative methods
          
          # Method 1: Use Supabase Storage if available
          echo "Checking InsForge storage options..."
          
          # Method 2: Create a deployment manifest
          echo '{"deployed_at":"'${{ github.event.head_commit.timestamp }}'","files":[]}' > deploy-manifest.json
          
          echo "Deploy preparation complete. Manual upload may be required."

      - name: Create Deploy Summary
        if: always()
        run: |
          echo "=== Deploy Summary ==="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Files changed: ${{ github.event.commits.length }}"
          echo ""
          echo "To complete deploy, you may need to:"
          echo "1. Use InsForge dashboard: https://insforge.com/dashboard"
          echo "2. Or add INSFIRE_API_KEY to GitHub secrets"
          echo "3. Or use SCP/FTP with credentials"

  # Alternative: If you have InsForge API token
  deploy-with-token:
    if: secrets.INSFIRE_API_KEY != ''
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Deploy via InsForge API
        env:
          INSFIRE_API_KEY: ${{ secrets.INSFIRE_API_KEY }}
        run: |
          echo "Using InsForge API token for deploy..."
          # This would require the actual InsForge API endpoint
          # curl -X POST https://api.insforge.com/deploy -H "Authorization: Bearer $INSFIRE_API_KEY" ...