name: Deploy to InsForge

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '!.github/workflows/deploy-insforge.yml'

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install InsForge CLI
        run: npm install -g @insforge/cli

      - name: Link project
        run: npx @insforge/cli link --project-id dd279199-b379-4c33-ac81-d030cb775585 --api-key ${{ secrets.INSFORGE }} --api-base-url https://guuimyx3.eu-central.insforge.app

      - name: Deploy functions
        run: |
          for f in functions/*.js; do
            name=$(basename "$f" .js)
            echo "Deploying $name..."
            npx @insforge/cli functions deploy "$name" --file "$f" || echo "Failed: $name"
          done
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE }}
